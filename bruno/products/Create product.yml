info:
  name: Create product
  type: http
  seq: 42

http:
  method: POST
  url: "{{baseUrl}}/api/admin/products"
  body:
    type: json
    data: |-
      {
        "name": "Bruno Test Product",
        "description": "Test product from Bruno collection",
        "ingredients": "Test ingredients",
        "usageInstructions": "Test usage instructions",
        "weightG": 100,
        "priceIdr": 50000,
        "stock": 10,
        "sku": "BRUNO-TEST-001"
      }
  auth:
    type: bearer
    token: "{{jwtToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        if (body && body.data) {
          bru.setVar('productId', body.data.id || '');
          bru.setVar('productSlug', body.data.slug || '');
        }
        bru.setNextRequest('Create category');

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "Success (201)"
    request:
      url: "{{baseUrl}}/api/admin/products"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "Bruno Test Product",
            "description": "Test product from Bruno collection",
            "ingredients": "Test ingredients",
            "usageInstructions": "Test usage instructions",
            "weightG": 100,
            "priceIdr": 50000,
            "stock": 10,
            "sku": "BRUNO-TEST-001"
          }
    response:
      status: 201
      statusText: "Created"
      headers:
        - name: Content-Type
          value: "application/json; charset=utf-8"
      body:
        type: json
        data: |-
          {
            "success": true,
            "statusCode": 201,
            "message": [
              "Product Bruno Test Product created successfully"
            ],
            "data": {
              "id": 9,
              "name": "Bruno Test Product",
              "slug": "bruno-test-product",
              "isActive": true,
              "categoryId": null,
              "highlightId": null,
              "tags": [],
              "description": "Test product from Bruno collection",
              "ingredients": null,
              "usageInstructions": null,
              "createdAt": "2026-05-26T02:14:52.500Z",
              "updatedAt": "2026-05-26T02:14:52.500Z",
              "category": null,
