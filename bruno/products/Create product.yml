info:
  name: Create product
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/admin/products"
  body:
    type: multipartForm
    data:
      - name: name
        type: text
        value: MamaBear AlmonMix Isi 6 Sachet
      - name: description
        type: text
        value: Minuman Serbuk dengan Almond
      - name: ingredients
        type: text
        value: Daun Katuk, Daun Kelor, Almond
      - name: usageInstructions
        type: text
        value: Seduh 1 sachet dengan 200 ml air hangat
      - name: weightG
        type: text
        value: "180"
      - name: priceIdr
        type: text
        value: "80000"
      - name: stock
        type: text
        value: "100"
      - name: sku
        type: text
        value: ALMMBR01
      - name: slug
        type: text
        value: mamabear-almonmix-isi-6-sachet
      - name: "tags[0]"
        type: text
        value: formula
      - name: "tags[1]"
        type: text
        value: lactation
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        if (body && body.data) {
          bru.setVar('productId', body.data.id || '');
          bru.setVar('productSlug', body.data.slug || '');
        }
        bru.setNextRequest('Create category');

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "Success (201)"
    request:
      url: "{{baseUrl}}/api/admin/products"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "MamaBear AlmonMix Isi 6 Sachet",
            "description": "Minuman Serbuk dengan Almond",
            "ingredients": "Daun Katuk, Daun Kelor, Almond",
            "usageInstructions": "Seduh 1 sachet",
            "weightG": 180,
            "priceIdr": 80000,
            "stock": 100,
            "sku": "ALMMBR01",
            "isActive": true,
            "tags": [
              "formula",
              "lactation"
            ],
            "images": []
          }
    response:
      status: 201
      statusText: "Created"
      headers:
        - name: Content-Type
          value: "application/json; charset=utf-8"
      body:
        type: json
        data: |-
