  - name: "Unauthorized (401)"
    request:
      url: "{{baseUrl}}/api/admin/products"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "Test"
          }
    response:
      status: 401
      statusText: "Unauthorized"
      headers:
        - name: Content-Type
          value: "application/json; charset=utf-8"
