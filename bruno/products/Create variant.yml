info:
  name: Create variant
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/api/admin/products/{{productId}}/variants"
  body:
    type: multipart-form
    data:
      - name: name
        type: text
        value: MamaBear AlmonMix - Rasa Cokelat
      - name: priceIdr
        type: text
        value: "80000"
      - name: weightG
        type: text
        value: "180"
      - name: sku
        type: text
        value: ALMMBR01-CHK
      - name: stock
        type: text
        value: "50"
      - name: sortOrder
        type: text
        value: "0"
  auth:
    type: bearer
    token: "{{jwtToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        if (body && body.data) {
          bru.setVar('variantId', body.data.id || '');
        }
        bru.setNextRequest('Create product review');

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "Success (201)"
    request:
      url: "{{baseUrl}}/api/admin/products/1/variants"
      method: POST
      body:
        type: multipart-form
        data:
          - name: name
            type: text
            value: MamaBear AlmonMix - Rasa Cokelat
          - name: priceIdr
            type: text
            value: "80000"
          - name: weightG
            type: text
            value: "180"
          - name: sku
            type: text
            value: ALMMBR01-CHK
          - name: stock
            type: text
            value: "50"
          - name: sortOrder
            type: text
            value: "0"
    response:
      status: 201
      statusText: "Created"
      headers:
        - name: Content-Type
          value: "application/json; charset=utf-8"
      body:
        type: json
        data: |-
          {
            "success": true,
            "statusCode": 201,
            "message": [
              "Variant created successfully"
            ],
            "data": {
              "id": 2,
              "productId": 1,
              "name": "MamaBear AlmonMix - Rasa Cokelat",
              "priceIdr": "80000",
              "weightG": 180,
              "sku": "ALMMBR01-CHK",
              "stock": 50,
              "sortOrder": 0,
              "createdAt": "2026-05-25T14:30:00.000Z",
              "updatedAt": "2026-05-25T14:30:00.000Z"
            },
            "timestamp": "2026-05-25T14:30:00.000Z"
          }
  - name: "Unauthorized (401)"
    request:
      url: "{{baseUrl}}/api/admin/products/1/variants"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "Test"
          }
    response:
      status: 401
      statusText: "Unauthorized"
      headers:
        - name: Content-Type
          value: "application/json; charset=utf-8"
      body:
        type: json
        data: |-
          {
            "success": false,
            "statusCode": 401,
            "message": [
              "Unauthorized"
            ],
            "data": null,
            "timestamp": "2026-05-25T00:00:00.000Z"
          }
  - name: "Validation Error (400)"
    request:
      url: "{{baseUrl}}/api/admin/products/1/variants"
      method: POST
      body:
        type: multipart-form
        data:
          - name: name
            type: text
            value: ""
          - name: priceIdr
            type: text
            value: ""
          - name: weightG
            type: text
            value: ""
    response:
      status: 400
      statusText: "Bad Request"
      headers:
        - name: Content-Type
          value: "application/json; charset=utf-8"
      body:
        type: json
        data: |-
          {
            "success": false,
            "statusCode": 400,
            "message": [
              "name should not be empty",
              "priceIdr should not be empty",
              "priceIdr must be a number conforming to the specified constraints",
              "weightG should not be empty",
              "weightG must be a number conforming to the specified constraints"
            ],
            "data": null,
            "timestamp": "2026-05-25T14:24:28.235Z"
          }
  - name: "Product Not Found (400)"
    request:
      url: "{{baseUrl}}/api/admin/products/999999/variants"
      method: POST
      body:
        type: multipart-form
        data:
          - name: name
            type: text
            value: Test Variant
          - name: priceIdr
            type: text
            value: "50000"
          - name: weightG
            type: text
            value: "100"
          - name: sku
            type: text
            value: TEST.NOTFOUND
          - name: stock
            type: text
            value: "10"
          - name: sortOrder
            type: text
            value: "0"
    response:
      status: 400
      statusText: "Bad Request"
      headers:
        - name: Content-Type
          value: "application/json; charset=utf-8"
      body:
        type: json
        data: |-
          {
            "success": false,
            "statusCode": 400,
            "message": [
              "Product not found"
            ],
            "data": null,
            "timestamp": "2026-05-25T14:24:28.235Z"
          }
