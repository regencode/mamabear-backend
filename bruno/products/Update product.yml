info:
  name: Update product
  type: http
  seq: 10

http:
  method: PUT
  url: "{{baseUrl}}/api/admin/products/{{productId}}"
  body:
    type: multipart-form
    data:
      - name: name
        type: text
        value: MamaBear AlmonMix Isi 6 Sachet (Updated)
      - name: description
        type: text
        value: "Updated: Minuman Serbuk dengan Almond Kaya Nutrisi"
      - name: slug
        type: text
        value: mamabear-almonmix-isi-6-sachet-v2
      - name: priceIdr
        type: text
        value: "85000"
      - name: stock
        type: text
        value: "75"
  auth:
    type: bearer
    token: "{{jwtToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setNextRequest('Update category');

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

