info:
  name: Create admin
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/api/auth/create-admin"
  body:
    type: json
    data: |-
      {
        "email": "admin2@mamabear.id",
        "password": "admin12345678",
        "name": "Admin User",
        "phone": "081234567891"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "Success (201)"
    request:
      url: "{{baseUrl}}/api/auth/create-admin"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "admin2@mamabear.id",
            "password": "admin12345678",
            "name": "Admin User",
            "phone": "081234567891"
          }
    response:
      status: 201
      statusText: "Created"
      headers:
        - name: Content-Type
          value: "application/json; charset=utf-8"
      body:
        type: json
        data: |-
          {
            "success": true,
            "statusCode": 201,
            "message": [
              "Admin created successfully"
            ],
            "data": {
              "id": "uuid-here",
              "email": "admin2@mamabear.id",
              "name": "Admin User",
              "role": "ADMIN"
            },
            "timestamp": "2026-05-25T00:00:00.000Z"
          }
  - name: "Validation Error (400)"
    request:
      url: "{{baseUrl}}/api/auth/create-admin"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "not-an-email",
            "password": "",
            "name": "",
            "phone": ""
          }
    response:
      status: 400
      statusText: "Bad Request"
      headers:
        - name: Content-Type
          value: "application/json; charset=utf-8"
      body:
        type: json
        data: |-
          {
            "success": false,
            "statusCode": 400,
            "message": [
              "email must be an email",
              "password should not be empty",
              "name should not be empty",
              "phone should not be empty"
            ],
            "data": null,
            "timestamp": "2026-05-25T00:00:00.000Z"
          }
